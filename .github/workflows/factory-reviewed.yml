name: factory-reviewed

on:
  pull_request_review:

permissions:
  pull-requests: write
  issues: write

jobs:
  move-card:
    # CodeRabbit signals it is finished with a 'commented' review, never an
    # approval, so anything that is not a block counts as done. Together with
    # factory-changes-requested.yml this partitions every submitted review.
    # States arrive lowercase in the webhook, unlike the GraphQL enum.
    if: >-
      github.event.action == 'submitted' &&
      github.event.review.state != 'changes_requested' &&
      github.event.review.user.login != github.event.pull_request.user.login
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Park the card in /factory-needs-you to merge
        env:
          GH_TOKEN: ${{ secrets.FACTORY_PROJECT_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          STATE: ${{ github.event.review.state }}
        run: |
          set -euo pipefail

          PROJECT_NUMBER=$(jq -r '.projectNumber' .factory/board.json)
          FIELD_ID=$(jq -r '.statusFieldId' .factory/board.json)
          COLUMN=$(jq -r '.needsYouColumn' .factory/board.json)

          # The issue this PR closes, and its card on our project. One round trip.
          gh api graphql -f query='
            query($owner:String!, $repo:String!, $pr:Int!) {
              repository(owner:$owner, name:$repo) {
                pullRequest(number:$pr) {
                  closingIssuesReferences(first:10) {
                    nodes {
                      number
                      projectItems(first:10) { nodes { id project { number } } }
                    }
                  }
                }
              }
            }' -f owner="${GITHUB_REPOSITORY%/*}" -f repo="${GITHUB_REPOSITORY#*/}" \
               -F pr="$PR" > refs.json

          ITEM=$(jq -r --argjson p "$PROJECT_NUMBER" '
            [ .data.repository.pullRequest.closingIssuesReferences.nodes[]
              | .projectItems.nodes[] | select(.project.number == $p) | .id ][0] // empty
          ' refs.json)

          if [ -z "$ITEM" ]; then
            gh pr comment "$PR" --body "No linked issue on project $PROJECT_NUMBER, so no card was moved. If this change belongs to a factory card, move it to **$COLUMN** by hand."
            echo "PR #$PR closes no card on project $PROJECT_NUMBER" >&2
            exit 1
          fi

          # Option ids change every time the column list is replaced, so look it up by name.
          OPT=$(gh api graphql -f query="query{node(id:\"$FIELD_ID\"){... on ProjectV2SingleSelectField{options{id name}}}}" \
            | jq -r --arg want "$COLUMN" '
                [ .data.node.options[] | select(.name == $want) | .id ][0] // empty')

          if [ -z "$OPT" ]; then
            echo "no column named '$COLUMN' on the board" >&2
            exit 1
          fi

          PROJECT_ID=$(jq -r '.projectId' .factory/board.json)

          gh api graphql -f query='
            mutation($p:ID!, $i:ID!, $f:ID!, $o:String!) {
              updateProjectV2ItemFieldValue(input:{
                projectId:$p, itemId:$i, fieldId:$f,
                value:{ singleSelectOptionId:$o }}) { projectV2Item { id } }
            }' -f p="$PROJECT_ID" -f i="$ITEM" -f f="$FIELD_ID" -f o="$OPT" > /dev/null

          # Read it back. An API write reporting success is not proof.
          NOW=$(gh api graphql -f query="query{node(id:\"$ITEM\"){... on ProjectV2Item{fieldValueByName(name:\"Status\"){... on ProjectV2ItemFieldSingleSelectValue{name}}}}}" \
            | jq -r '.data.node.fieldValueByName.name')

          if [ "$NOW" != "$COLUMN" ]; then
            echo "wrote $COLUMN but the card reads $NOW" >&2
            exit 1
          fi

          # The card has to say what it wants. /factory-needs-you is the only column a
          # human watches, and one that needs opening twice is a column that lies.
          ISSUE=$(jq -r '
            [ .data.repository.pullRequest.closingIssuesReferences.nodes[].number ][0]
          ' refs.json)
          COMMENTS=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.review_comments')

          gh issue view "$ISSUE" --json body --jq '.body' > body.md

          # Strip any ACTION/RETURN TO pair already there, so a card that passes
          # through twice carries one, the current one.
          RETRO=$(jq -r '.retroColumn' .factory/board.json)

          python3 - "$STATE" "$COMMENTS" "$PR" "$RETRO" <<'PY'
          import io, re, sys
          state, comments, pr, nxt = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          body = io.open('body.md', encoding='utf-8').read()
          body = re.sub(r'^\*\*ACTION:\*\*.*?\n\*\*RETURN TO:\*\*.*?\n(?:\s*---\s*\n)?\s*',
                        '', body, count=1, flags=re.S)
          plural = '' if comments == '1' else 's'
          head = (f'**ACTION:** CodeRabbit finished with {state} and {comments} comment{plural}. '
                  f'Read the diff and merge PR #{pr}.\n'
                  f'**RETURN TO:** {nxt}\n\n---\n\n')
          io.open('body.md', 'w', encoding='utf-8', newline='\n').write(head + body)
          PY

          gh issue edit "$ISSUE" --body-file body.md > /dev/null

          echo "parked card in $COLUMN: $STATE, $COMMENTS comment(s)"
